name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax
        run: python -m compileall -q app.py test_app.py

      - name: Run tests
        env:
          # Keep the test database, encrypted files and session key out of the checkout.
          DATA_DIR: ${{ runner.temp }}/secureshare-data
        run: python test_app.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag secureshare:ci .

      - name: Smoke test the container
        run: |
          docker run --detach --name secureshare --publish 8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            --volume secureshare-ci-data:/data secureshare:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/healthz | grep -qx ok; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"; docker logs secureshare; exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs secureshare || true
