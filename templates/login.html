{% extends "base.html" %}{% block body %}
<h1>Sign in</h1>
<form method="post">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next }}">
<label>Username</label><input name="username" value="{{ username }}" required autofocus autocomplete="username">
<label>Password</label><input type="password" name="password" required autocomplete="current-password">
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<button>Sign in</button></form>
<p class="muted"><a href="/forgot">Forgot your password?</a></p>
<p class="muted">No account? <a href="/register">Register</a></p>{% endblock %}
